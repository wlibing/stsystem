<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>合并单元格示例</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
    <title>Login</title>
    <link th:href="@{/webjars/bootstrap/4.4.1-1/css/bootstrap.min.css}" rel="stylesheet"></link>
    <script th:src="@{/webjars/jquery/3.3.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/4.4.1-1/js/bootstrap.min.js}"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body class="text-center">

<h1>Login</h1>
<div th:if="${validationError}" th:each="error : ${validationError}">
    <p style="color: red;">ユーザ名またはパスワードが異なります。</p>
</div>
</table>
<form th:action="@{/user/login}" th:object="${user002Request}"
      th:method="post" id="form">
    <label>ユーザーID</label>
    <input type="text" id="userNo" name="userNo" size="40"/><br/>
    <br/>
    <label>パスワード</label>
    <input type="password" id="passWord" name="passWord" size="40"/><br/>
    <br/>
    <input class="btn btn-primary" type="button" value="ログイン" onclick="loginClick()"></input>
</form>
<br/>
<a th:href="@{/signup}">新規登録はこちら</a><br>
</body>

<script>
    function loginClick() {
        let userNo = document.getElementById('userNo').value;
        let password = document.getElementById('passWord').value;

        if (userNo == '') {
            alert("userNoを入力してください！")
            return;
        }
        if (password == '') {
            alert("passwordを入力してください！")
            return;
        }
        document.getElementById('form').submit();
    }
</script>
<table>
    <tr>
        <th>编号</th>
        <th>姓名</th>
        <th>年龄</th>
    </tr>
    <tr>
        <td>1</td>
        <td>张三</td>
        <td>25</td>
    </tr>
    <tr>
        <td>2</td>
        <td>李四</td>
        <td>30</td>
    </tr>
    <tr>
        <td>3</td>
        <td>王五</td>
        <td>28</td>
    </tr>
</table>

<table>
    <tr>
        <th rowspan="2">编号</th>
        <th rowspan="2">姓名</th>
        <th colspan="2">联系方式</th>
        <th rowspan="2">年龄</th>
    </tr>
    <tr>
        <th>电话</th>
        <th>邮箱</th>
    </tr>
    <tr>
        <td>1</td>
        <td>张三</td>
        <td>123-4567</td>
        <td>zhangsan@example.com</td>
        <td>25</td>
    </tr>
    <tr>
        <td>2</td>
        <td>李四</td>
        <td>234-5678</td>
        <td>lisi@example.com</td>
        <td>30</td>
    </tr>
    <tr>
        <td>3</td>
        <td rowspan="2">王五</td>
        <td>345-6789</td>
        <td>wangwu@example.com</td>
        <td>28</td>
    </tr>
    <tr>
        <td>4</td>
        <td>987-6543</td>
        <td>wangwu2@example.com</td>
        <td>28</td>
    </tr>
</table>

</body>
</html>
