<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="主任情報一覧"></title>
    <link th:href="@{/webjars/bootstrap/4.4.1-1/css/bootstrap.min.css}" rel="stylesheet"></link>
    <script th:src="@{/webjars/jquery/3.3.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/4.4.1-1/js/bootstrap.min.js}"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
</head>
<body>
<h1>主任情報検索</h1>
<table>
    <tr th:if="${validationError}" th:each="error : ${validationError}">
        <td style="color: red;" th:text="${error}"></td>
    </tr>
</table>
<form th:action="@{/director/search}" th:object="${director003Request}"
      th:method="post" class="form-inline my-2 my-lg-0">
    <div>
        <div>
            主任ID：<input type="text" name="id" class="form-control mr-sm-2" th:value="${id}" placeholder="主任Id"/>
            主任名前：<input type="text" name="name" class="form-control mr-sm-2" th:value="${name}" placeholder="名前"/>
            <input type="submit" value="検索" class="btn btn-outline-success my-2 my-sm-0"/>
        </div>
    </div>
</form>
<br/>
<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>主任員名前</th>
        <th>年齢</th>
        <th>性別</th>
        <th>電話番号</th>
        <th>有効フラグ</th>
        <th>Edit</th>
    </tr>
    </thead>
    <div th:if="${directorinfolist != null}">
        <tbody>

        <tr th:each="director, st : ${directorinfolist}" th:object="${director}" class="align-middle">
            <td>
                <label th:text="${director.id}"></label>
                <input type="hidden" field="${directorinfolist[__${st.index}__].id}">
            </td>
            <td>
                <label th:text="${director.name}"></label>

                <input type="hidden" class="form-control" field="${directorinfolist[__${st.index}__].name}">
            </td>
            <td>
                <label th:text="${director.age}"></label>
                <input type="hidden" class="form-control" field="*{directorinfolist[__${st.index}__].age}">
            </td>
            <td>

                <label th:text="${director.sex}"></label>
                <input type="hidden" class="form-control" field="*{directorinfolist[__${st.index}__].sex}">
            </td>
            <td>

                <label th:text="${director.tel}"></label>
                <input type="hidden" class="form-control" field="*{directorinfolist[__${st.index}__].tel}">
            </td>
            <td>

                <label th:if="${director.disableFlag == '1'}">
                    有效
                </label>
                <label th:if="${director.disableFlag == '0'}">
                    无效
                </label>
                <input type="hidden" class="form-control" field="*{directorinfolist[__${st.index}__].powerFlag}">
            </td>
            <td>
                <button th:attr="onclick='location.href=\'/director/info?id=' + ${director.id} + '\''" type="button"
                        class="btn btn-primary">
                    詳細
                </button>
            </td>
        </tr>
        <div th:if="${directorinfolist.size() == 0}" style="color: red">no data</div>
        </tbody>

    </div>

</table>
</div>

</div>
</body>
</html>
